{% extends "base.html" %}
{% block title %}Events{% endblock %}

{% block content %}
<h3 class="mb-4"><i class="bi bi-calendar3"></i> Upcoming Events</h3>
<div id="eventsContainer" class="row g-3"></div>
<div class="modal fade" id="mapModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="mapModalLabel">Event Location</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <iframe id="mapFrame" width="100%" height="350" style="border:0" loading="lazy"></iframe>
                <a id="directionsLink" href="#" target="_blank" class="btn btn-primary w-100 mt-2">
                    <i class="bi bi-signpost-2"></i> Get Directions
                </a>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="weatherModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="weatherModalLabel">Weather</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="weatherModalBody">
                Loading...
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/events.js') }}"></script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Event Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<!-- Toast Container (notifications ke liye) -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
    <div id="appToast" class="toast" role="alert">
        <div class="toast-header">
            <strong class="me-auto" id="toastTitle">Notification</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastBody"></div>
    </div>
</div>

<!-- Confirm Modal (confirm() ki jagah) -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="confirmModalBody">Are you sure?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmModalYesBtn">Yes, Continue</button>
            </div>
        </div>
    </div>
</div>
<script>
    // Back-forward cache se restore hone par bhi check chale
    window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
            const protectedPages = ['/admin-dashboard', '/vendor-dashboard', '/my-bookings', '/home'];
            if (protectedPages.includes(window.location.pathname) && !localStorage.getItem('token')) {
                window.location.href = '/login';
            }
        }
    });
</script>
<script>
    (function checkSessionExpiry() {
        const token = localStorage.getItem('token');
        const loginTime = localStorage.getItem('loginTime');
        const SESSION_DURATION_MS = 5 * 60 * 1000; // 5 minutes session expiry time
        const WARNING_BEFORE_MS = 60 * 1000;
        if (token && loginTime) {
            const elapsed = Date.now() - parseInt(loginTime);
            const remaining = SESSION_DURATION_MS - elapsed;

            if (remaining <= 0) {
                performLogout('Your session has expired. Please log in again.');
                return;
            }

            if (remaining <= WARNING_BEFORE_MS) {
                showSessionWarning(remaining);
            } else {
                // Warning ke waqt tak wait karo, phir dikhao
                setTimeout(() => showSessionWarning(WARNING_BEFORE_MS), remaining - WARNING_BEFORE_MS);
            }

            // Jab session poora expire ho, khud logout kar do
            setTimeout(() => performLogout('Your session has expired. Please log in again.'), remaining);
        }
    })();

    function showSessionWarning(msRemaining) {
        const seconds = Math.ceil(msRemaining / 1000);
        showToast(`Your session will expire in ${seconds} seconds. Please save your work.`, 'warning');
    }

    function performLogout(message) {
        localStorage.removeItem('token');
        localStorage.removeItem('role');
        localStorage.removeItem('name');
        localStorage.removeItem('userId');
        localStorage.removeItem('loginTime');

        // Sirf tab redirect karo jab already login page pe na ho
        if (window.location.pathname !== '/login') {
            alert(message);
            window.location.href = '/login';
        }
    }
</script>
<script>
    // Toast dikhane ka helper — alert() ki jagah
    function showToast(message, type = 'success') {
        const toastEl = document.getElementById('appToast');
        const toastBody = document.getElementById('toastBody');
        const toastTitle = document.getElementById('toastTitle');

        toastEl.classList.remove('text-bg-success', 'text-bg-danger', 'text-bg-warning');
        if (type === 'success') { toastEl.classList.add('text-bg-success'); toastTitle.textContent = 'Success'; }
        else if (type === 'error') { toastEl.classList.add('text-bg-danger'); toastTitle.textContent = 'Error'; }
        else { toastEl.classList.add('text-bg-warning'); toastTitle.textContent = 'Notice'; }

        toastBody.textContent = message;
        const toast = bootstrap.Toast.getOrCreateInstance(toastEl);
        toast.show();
    }

    function showConfirm(message) {
        return new Promise((resolve) => {
            document.getElementById('confirmModalBody').textContent = message;
            const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('confirmModal'));
            const yesBtn = document.getElementById('confirmModalYesBtn');

            const cleanYes = yesBtn.cloneNode(true);
            yesBtn.parentNode.replaceChild(cleanYes, yesBtn);

            cleanYes.addEventListener('click', function () {
                modal.hide();
                resolve(true);
            });

            document.getElementById('confirmModal').addEventListener('hidden.bs.modal', function handler() {
                resolve(false);
                this.removeEventListener('hidden.bs.modal', handler);
            }, { once: true });

            modal.show();
        });
    }
</script>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="/"><i class="bi bi-calendar-event"></i> Event Hub</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/home"><i class="bi bi-calendar3"></i> Events</a></li>
                <li class="nav-item" id="bookingsNavLink"><a class="nav-link" href="/my-bookings"><i class="bi bi-bookmark-check"></i> My Bookings</a></li>
                <li class="nav-item" id="adminNavLink"><a class="nav-link" href="/admin-dashboard"><i class="bi bi-speedometer2"></i> Admin</a></li>
                <li class="nav-item" id="vendorNavLink"><a class="nav-link" href="/vendor-dashboard"><i class="bi bi-shop"></i> Vendor</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" id="loginNavLink"><a class="nav-link" href="/login">Login</a></li>
                <li class="nav-item" id="registerNavLink"><a class="nav-link" href="/register">Register</a></li>
                <li class="nav-item" id="logoutNavLink"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const role = localStorage.getItem('role');
        const token = localStorage.getItem('token');
        const adminLink = document.getElementById('adminNavLink');
        const vendorLink = document.getElementById('vendorNavLink');
        const bookingsLink = document.getElementById('bookingsNavLink');
        const loginLink = document.getElementById('loginNavLink');
        const registerLink = document.getElementById('registerNavLink');
        const logoutLink = document.getElementById('logoutNavLink');

        if (adminLink) {
            adminLink.style.display = (role === 'admin' || role === 'super_admin') ? '' : 'none';
        }
        if (vendorLink) {
            vendorLink.style.display = (role === 'vendor') ? '' : 'none';
        }
        if (bookingsLink) {
            bookingsLink.style.display = (role === 'user') ? '' : 'none';
        }
        if (token) {
        if (loginLink) loginLink.style.display = 'none';
        if (registerLink) registerLink.style.display = 'none';
        if (logoutLink) logoutLink.style.display = '';
        } else {
            if (loginLink) loginLink.style.display = '';
            if (registerLink) registerLink.style.display = '';
            if (logoutLink) logoutLink.style.display = 'none';
        }
    });
    </script>
    <script>
        async function logout() {
    const token = localStorage.getItem('token');
    try {
        await fetch('/auth/logout', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
    } catch (err) {
        // ignore — logout ho hi jayega chahe log fail ho jaye
    }
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    localStorage.removeItem('name');
    localStorage.removeItem('userId');
    localStorage.removeItem('loginTime');
    window.location.href = '/login';
}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

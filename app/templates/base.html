<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Event Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="/">Event Manager</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/home">Events</a></li>
                <li class="nav-item" id="adminNavLink"><a class="nav-link" href="/admin-dashboard">Admin</a></li>
                <li class="nav-item" id="vendorNavLink"><a class="nav-link" href="/vendor-dashboard">Vendor</a></li>
                <li class="nav-item" id="bookingsNavLink"><a class="nav-link" href="/my-bookings">My Bookings</a></li>
                <li class="nav-item"><a 
                <li class="nav-item"><a class="nav-link" href="/vendor-dashboard">Vendor</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const role = localStorage.getItem('role');
        const adminLink = document.getElementById('adminNavLink');
        const vendorLink = document.getElementById('vendorNavLink');
        const bookingsLink = document.getElementById('bookingsNavLink');

        if (adminLink) {
            adminLink.style.display = (role === 'admin' || role === 'super_admin') ? '' : 'none';
        }
        if (vendorLink) {
            vendorLink.style.display = (role === 'vendor') ? '' : 'none';
        }
        if (bookingsLink) {
            bookingsLink.style.display = (role === 'user') ? '' : 'none';
        }
    });
    </script>
    <script>
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<h3 class="mb-4"><i class="bi bi-speedometer2"></i> Admin Dashboard</h3>

<!-- Sirf Super Admin ko dikhega -->
<div id="roleSelector" class="d-none mb-4">
    <div class="row g-3">
        <div class="col-md-4">
            <button class="btn btn-lg btn-outline-primary w-100 selectorBtn" id="showUsersBtn">
                <i class="bi bi-people-fill"></i> Manage Users
            </button>
        </div>
        <div class="col-md-4">
            <button class="btn btn-lg btn-outline-success w-100 selectorBtn" id="showEventsBtn">
                <i class="bi bi-calendar-event"></i> Manage Events
            </button>
        </div>
        <div class="col-md-4">
            <button class="btn btn-lg btn-outline-dark w-100 selectorBtn" id="showAuditBtn">
                <i class="bi bi-clock-history"></i> Audit Trail
            </button>
        </div>
    </div>
</div>

<!-- Manage Users Section -->
<div id="superAdminSection" class="d-none">
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title"><i class="bi bi-people-fill"></i> Manage Users</h5>
            <div id="usersContainer"></div>
        </div>
    </div>
</div>
<div id="auditLogSection" class="d-none">
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title"><i class="bi bi-clock-history"></i> Audit Trail</h5>
            <div id="auditLogContainer" style="max-height: 500px; overflow-y: auto;"></div>
        </div>
    </div>
</div>
<!-- Manage Events Section -->
<div id="manageEventsSection" class="d-none">
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title"><i class="bi bi-plus-circle"></i> Create New Event</h5>
            <div id="createErrorBox" class="alert alert-danger d-none"></div>
            <form id="createEventForm" class="row g-2">
                <div class="col-md-4"><input type="text" class="form-control" id="name" placeholder="Event Name" required></div>
                <div class="col-md-2"><input type="date" class="form-control" id="date" required></div>
                <div class="col-md-3"><input type="text" class="form-control" id="venue" placeholder="Venue" required></div>
                <div class="col-md-2"><input type="number" class="form-control" id="capacity" placeholder="Capacity" required></div>
                <div class="col-md-8"><input type="text" class="form-control" id="description" placeholder="Description (optional)"></div>
                <div class="col-md-2"><input type="number" step="0.01" class="form-control" id="price" placeholder="Price" required></div>
                <div class="col-md-4"><button type="submit" class="btn btn-success w-100">Create Event</button></div>
            </form>
        </div>
    </div>

    <h5 class="mb-3">My Events</h5>
    <div id="myEventsContainer"></div>
</div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="detailModalLabel">Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="detailModalBody">
                <!-- JS yahan content daalega -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
